# Detectors are DATA. Adding an ecosystem is a change to this file only.
#
# Rules, enforced by tests:
#   - `question` must be one of docsbase.detect.QUESTIONS
#   - a detector extracts only what it can quote literally from a file
#   - nothing here is required; zero matches is a valid, working run
#
# extract:
#   "glob-names"  file names matched by `when`
#   "json-keys"   keys at `pointer` in a JSON file
#   "line-prefix" lines in `when` matching `pattern`, first capture group
#   "toml-list"   list values at `pointer` (dot-separated path) in TOML file

[[detector]]
question = "pre-commit-automation"
when = ".husky/*"
extract = "glob-names"

[[detector]]
question = "pre-commit-automation"
when = ".pre-commit-config.yaml"
extract = "glob-names"

[[detector]]
question = "pre-commit-automation"
when = "lefthook.yml"
extract = "glob-names"

# No detector on .git/hooks/* — deliberately absent. .git/ is untracked,
# machine-local state (git installs *.sample hooks in every repo whether or
# not anyone wired them up), never a project convention worth recording.
# Do not re-add it.

[[detector]]
question = "gate-commands"
when = "package.json"
extract = "json-keys"
pointer = "scripts"

[[detector]]
question = "gate-commands"
when = "Justfile"
extract = "line-prefix"
pattern = "^([a-zA-Z][a-zA-Z0-9_-]*):"

[[detector]]
question = "gate-commands"
when = "Makefile"
extract = "line-prefix"
pattern = "^([a-zA-Z][a-zA-Z0-9_-]*):"

[[detector]]
question = "gate-commands"
when = "Taskfile.yml"
extract = "line-prefix"
pattern = "^  ([a-zA-Z][A-Za-z0-9_:-]*):"

[[detector]]
question = "units"
when = "pnpm-workspace.yaml"
extract = "line-prefix"
pattern = "^\\s*-\\s*[\"']?([^\"'\\s]+)[\"']?\\s*$"

[[detector]]
question = "units"
when = "Cargo.toml"
extract = "toml-list"
pointer = "workspace.members"

[[detector]]
question = "units"
when = "go.work"
extract = "line-prefix"
pattern = "^\\s*(?:use\\s+)?\\.?/?([A-Za-z0-9_./-]+)\\s*$"

[[detector]]
question = "units"
when = "settings.gradle"
extract = "line-prefix"
pattern = "^\\s*include\\s+['\"]:?([A-Za-z0-9_.:-]+)['\"]"

[[detector]]
question = "dependency-manifests"
when = "package.json"
extract = "glob-names"

[[detector]]
question = "dependency-manifests"
when = "Cargo.toml"
extract = "glob-names"

[[detector]]
question = "dependency-manifests"
when = "pyproject.toml"
extract = "glob-names"

[[detector]]
question = "dependency-manifests"
when = "go.mod"
extract = "glob-names"

[[detector]]
question = "dependency-manifests"
when = "pom.xml"
extract = "glob-names"
